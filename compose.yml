services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lascarinosas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lascarinosas
      DB_USER: postgres
      DB_PASSWORD: postgres
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/las-carinosas
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keycloak

volumes:
  postgres_data:

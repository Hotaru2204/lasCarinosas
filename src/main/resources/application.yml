spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lascarinosas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/las-carinosas}

server:
  port: 8080
